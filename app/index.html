<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HTML Scaffold & Calculator Display Layout</title>
</head>
<body>
	<div id="display-screen"></div>
	<div class="keypad">
		<div class="button-grid">
			<button id="clear-btn">Clear</button>
			<div class="button-row">
			<button id="equals-btn">=</button>
			<button>7</button>
			<button>8</button>
			<button>9</button>
			<button id="divide-btn">/</button>
			</div>
			<div class="button-row">
			<button>4</button>
			<button>5</button>
			<button>6</button>
			<button id="multiply-btn">*</button>
			</div>
			<div class="button-row">
			<button>1</button>
			<button>2</button>
			<button>3</button>
			<button id="subtract-btn">-</button>
			</div>
			<div class="button-row">
			<button>0</button>
			<button id="add-btn">+</button>
			</div>
		</div>
	</div>
</body>
</html>
