<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mini Calculator</title>
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="keypad.css">
</head>
<body>
	<div class="app-container">
		<!-- Calculator Card -->
		<div class="calculator-card">
			<h1 class="title">Mini Calculator</h1>
			<div id="display-screen">
				<div class="previous-expression"></div>
				<div class="current-value">0</div>
			</div>
			<div class="keypad">
				<button class="keypad-button btn-clear" id="clear-btn" onclick="clearDisplay()">C</button>
				<button class="keypad-button btn-action" id="delete-btn" onclick="deleteLastChar()">⌫</button>
				<button class="keypad-button btn-operator" id="divide-btn" onclick="appendOperator('/')">/</button>
				<button class="keypad-button btn-operator" id="multiply-btn" onclick="appendOperator('*')">×</button>

				<button class="keypad-button" onclick="appendNumber('7')">7</button>
				<button class="keypad-button" onclick="appendNumber('8')">8</button>
				<button class="keypad-button" onclick="appendNumber('9')">9</button>
				<button class="keypad-button btn-operator" id="subtract-btn" onclick="appendOperator('-')">-</button>

				<button class="keypad-button" onclick="appendNumber('4')">4</button>
				<button class="keypad-button" onclick="appendNumber('5')">5</button>
				<button class="keypad-button" onclick="appendNumber('6')">6</button>
				<button class="keypad-button btn-operator" id="add-btn" onclick="appendOperator('+')">+</button>

				<button class="keypad-button" onclick="appendNumber('1')">1</button>
				<button class="keypad-button" onclick="appendNumber('2')">2</button>
				<button class="keypad-button" onclick="appendNumber('3')">3</button>
				<button class="keypad-button btn-equals" id="equals-btn" onclick="calculateResult()">=</button>

				<button class="keypad-button" style="grid-column: span 2;" onclick="appendNumber('0')">0</button>
				<button class="keypad-button" onclick="appendDecimal()">.</button>
			</div>
		</div>

		<!-- Calculation History Panel -->
		<div class="history-panel">
			<div class="history-header">
				<h2>History Log</h2>
				<button id="clear-history-btn">Clear History</button>
			</div>
			<ul id="history-list">
				<li class="empty-history">No calculation history yet</li>
			</ul>
		</div>
	</div>

	<script src="script/calculation_history.js"></script>
	<script src="js/app.js"></script>
</body>
</html>
